<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Instagram DM Context Menu</title>
<style>
  /* ============================================================
     REPLICA 1:1 dari screenshot (artboard 675 x 1200 px)
     Semua posisi/ukuran diukur dari piksel screenshot asli.
     Teks di bubble bisa diklik & diedit; bubble otomatis
     menyesuaikan panjang teks (fit-content).
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #f5f5f5;
    overflow: hidden;
  }

  #screen {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 675px;
    height: 1200px;
    transform-origin: 50% 50%; /* penting agar tetap pas di tengah saat diskalakan */
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.30);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                 "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- latar chat (di-generate JS, acak setiap refresh) ---------- */
  .bg {
    position: absolute;
    inset: 0;
    background-size: 100% 100%; /* gambar latar diisi oleh JS (acak setiap refresh) */
    background-repeat: no-repeat;
  }

  /* ================= STATUS BAR ================= */
  .time {
    position: absolute;
    left: 53px;
    top: 25.75px;
    font-size: 25px;
    line-height: 1.26;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: #000;
  }
  .sig  { position: absolute; left: 531px;   top: 29px; width: 33px; height: 22px; }
  .lte  {
    position: absolute;
    left: 568.5px;
    top: 29.2px;
    font-size: 18.5px;
    line-height: 1.26;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #000;
  }
  .batt { position: absolute; left: 605px;   top: 29px; width: 45px; height: 23px; }

  /* ================= STACK: pill + bubble + menu ================= */
  .stack {
    position: absolute;
    left: 18px;
    top: 381px;
    width: 639px;
  }

  /* ---------- Reaction pill ---------- */
  .pill {
    position: relative;
    width: 639px;
    height: 124px;
    background: #fff;
    border-radius: 62px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.16), 0 4px 12px rgba(0,0,0,0.08);
  }
  .cap {
    position: absolute;
    left: 0; right: 0;
    top: 7.7px;
    text-align: center;
    font-size: 22px;
    line-height: 1.26;
    font-weight: 400;
    color: #808080;
  }
  .emoji {
    position: absolute;
    top: 45px;
    width: 85.5px;
    height: 57px;
    line-height: 57px;
    text-align: center;
    font-size: 55px;
    font-family: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif;
  }
  .e1 { left: 19.25px; }  .e2 { left: 104.75px; } .e3 { left: 190.25px; }
  .e4 { left: 275.75px; } .e5 { left: 361.25px; } .e6 { left: 446.75px; }
  .plus { position: absolute; left: 556px; top: 56px; width: 36px; height: 36px; }

  /* ---------- Emoji gaya iPhone (Apple) ----------
     Semua emoji dirender sebagai gambar Apple Color Emoji,
     bukan font sistem, agar tampilan konsisten seperti di iPhone. */
  img.apple-emoji {
    display: inline-block;
    width: 1.15em;
    height: 1.15em;
    vertical-align: -0.2em;
    object-fit: contain;
    pointer-events: none;
  }
  .emoji {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .emoji img { width: 55px; height: 55px; }

  /* ---------- Message bubble (AUTO-SIZE mengikuti teks) ---------- */
  .bubble {
    margin-top: 23px;
    width: fit-content;
    max-width: 462px;
    background: #fff;
    border-radius: 28px;
    padding: 13.5px 20px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.13), 0 3px 10px rgba(0,0,0,0.07);
    font-size: 24px;
    line-height: 29.5px;
    color: #000;
  }
  #msg {
    display: inline-block;
    max-width: 422px;
    outline: none;
    cursor: text;
    overflow-wrap: break-word;
    -webkit-user-select: text;
    user-select: text;
  }

  /* ---------- Context menu ---------- */
  .menu {
    margin-top: 22px;
    width: 245px;
    background: #f6f6f6;
    border-radius: 19px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.20), 0 4px 14px rgba(0,0,0,0.10);
    overflow: hidden;
  }
  .row {
    position: relative;
    height: 71.5px;
  }
  .row + .row { border-top: 1px solid rgba(60,60,67,0.29); }
  .lbl {
    position: absolute;
    left: 28px;
    top: 20.5px;
    font-size: 24.5px;
    line-height: 1.26;
    font-weight: 400;
    color: #000;
    white-space: nowrap;
  }
  .lbl.red { color: #E21E42; }
  .row svg { position: absolute; width: 36px; height: 36px; }
  .ic-reply   { left: 181.25px; top: 17px; }
  .ic-forward { left: 181.25px; top: 18px; }
  .ic-copy    { left: 182px;    top: 17px; }
  .ic-report  { left: 181px;    top: 17.5px; }

  /* ================= DARK MODE ================= */
  body.dark { background: #101013; }
  body.dark .backdrop::after { background: rgba(0,0,0,0.55); }
  .dark .time, .dark .lte { color: #fff; }
  .dark .sig  rect[fill="#000"]    { fill: #fff; }
  .dark .sig  rect[fill="#b8b8b8"] { fill: rgba(255,255,255,0.35); }
  .dark .batt rect[fill="#000"]    { fill: #fff; }
  .dark .batt rect[stroke="rgba(0,0,0,0.42)"] { stroke: rgba(255,255,255,0.45); }
  .dark .batt rect[fill="rgba(0,0,0,0.45)"]   { fill: rgba(255,255,255,0.45); }
  .dark .pill  { background: #1C1C1E; box-shadow: 0 12px 32px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.35); }
  .dark .cap   { color: #98989D; }
  .dark .plus g{ stroke: #A5A5AA; }
  .dark .bubble{ background: #262626; color: #fff;
                 box-shadow: 0 10px 28px rgba(0,0,0,0.5), 0 3px 10px rgba(0,0,0,0.3); }
  .dark .menu  { background: #262626; box-shadow: 0 12px 36px rgba(0,0,0,0.6), 0 4px 14px rgba(0,0,0,0.35); }
  .dark .row + .row { border-top: 1px solid rgba(255,255,255,0.12); }
  .dark .lbl   { color: #fff; }
  .dark .lbl.red { color: #FF3040; }
  .dark .ic-reply g, .dark .ic-forward g, .dark .ic-copy g { stroke: #fff; }
  .dark .ic-copy path[fill="#f6f6f6"] { fill: #262626; }
  .dark .ic-report path, .dark .ic-report rect, .dark .ic-report circle
                               { stroke: #FF3040; fill: #FF3040; }
  .dark .ic-report path[fill="none"]  { fill: none; }
  .mode-toggle {
    position: absolute; right: 14px; bottom: 14px; z-index: 10;
    width: 54px; height: 54px; border-radius: 50%; border: none;
    cursor: pointer; font-size: 26px; line-height: 1;
    background: rgba(120,120,128,0.32);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }</style>
</head>

<script>
  /* ====== Skala kanvas — rasio TETAP 9:16 di semua perangkat ======
     675 x 1200 = 9:16 eksak. Sisi yang paling sempit menentukan
     skala, kanvas selalu utuh & di tengah; sisa layar apa pun
     (desktop / Android, portrait maupun landscape) otomatis
     terisi latar blur — tampilan konten tidak pernah melar. */
  var screenEl   = document.getElementById('screen');
  var backdropEl = document.querySelector('.backdrop');

  /* ====== Jam status bar: otomatis mengikuti WIB (Asia/Jakarta, UTC+7) ====== */
  var timeEl = document.querySelector('.time');
  function tickClock() {
    var t;
    try {
      t = new Intl.DateTimeFormat('id-ID', {
        timeZone: 'Asia/Jakarta',
        hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
      }).format(new Date());
      if (t.indexOf('24') === 0) t = '00' + t.slice(2);
    } catch (e) {
      /* fallback manual UTC+7 */
      var d = new Date(Date.now() + (420 + new Date().getTimezoneOffset()) * 60000);
      t = ('0' + d.getHours()).slice(-2) + '.' + ('0' + d.getMinutes()).slice(-2);
    }
    if (timeEl.textContent !== t) timeEl.textContent = t;
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ====== Latar chat acak: percakapan blur penuh warna, beda tiap refresh ======
     Latar berisi percakapan tiruan (bubble kiri/kanan, emoji, foto, voice note,
     avatar, pembatas tanggal) yang diburamkan seperti screenshot IG asli.
     Random seed tiap refresh; ?seed=12345 pada URL untuk latar tetap. */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seed;
  if (typeof window.__SEED === 'number') {
    seed = window.__SEED;
  } else {
    var mSeed = location.search.match(/[?&]seed=(\d+)/);
    seed = mSeed ? parseInt(mSeed[1], 10) : (Math.random() * 4294967296) >>> 0;
  }
  /* ====== Mode terang/gelap (dark mode) ====== */
  var DARK = (typeof window.__MODE === 'string')
    ? window.__MODE === 'dark'
    : (location.search.match(/[?&]mode=(dark|light)/) || [])[1] === 'dark';
  var bodyEl = document.body;
  function applyMode() {
    bodyEl.classList.toggle('dark', DARK);
    document.getElementById('screen').classList.toggle('dark', DARK);
  }
  function setMode(dark, persist) {
    DARK = dark;
    applyMode();
    if (window.__renderWallpaper) window.__renderWallpaper();
    if (persist) { try { localStorage.setItem('iqc-mode', dark ? 'dark' : 'light'); } catch (e) {} }
  }

  /* ====== Baterai status bar: acak 30%-100% (deterministik jika seed diset) ====== */
  (function () {
    var pct = 30 + Math.floor(mulberry32((seed ^ 0xBA77) >>> 0)() * 71); /* 30..100 */
    var fill = document.getElementById('batt-fill');
    if (fill) {
      var maxW = 31.75; /* lebar isi penuh di dalam bingkai baterai */
      fill.setAttribute('width', (maxW * pct / 100).toFixed(2));
      fill.setAttribute('rx', pct >= 95 ? '3.2' : '2.5');
    }
  })();


  (function makeChatWallpaper() {
    var rnd = mulberry32(seed);
    var W = 675, H = 1200;
    var off = document.createElement('canvas'); off.width = W; off.height = H;
    var octx = off.getContext('2d');
    var fin = document.createElement('canvas'); fin.width = W; fin.height = H;
    var fctx = fin.getContext('2d');
    var bgEl = document.querySelector('.bg');
    var WALLPAPER_BLUR = 26; /* kekuatan blur latar (px) */

    function hsl(h, s, l, a) {
      return 'hsla(' + ((h % 360) + 360) % 360 + ',' + s + '%,' + l + '%,' +
             (a === undefined ? 1 : a) + ')';
    }
    function rr(c, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }
    function blob(c, x, y, r, h, s, l, a) {
      var g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, hsl(h, s, l, a));
      g.addColorStop(1, hsl(h, s, l, 0));
      c.fillStyle = g;
      c.fillRect(x - r, y - r, r * 2, r * 2);
    }

    var F  = '400 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
    var F2 = '400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';

    /* ---------- pool pesan percakapan (alur nyata, bahasa santai) ---------- */
    var POOL = {
      open : ['wei', 'eh halo', 'woy', 'p', 'haloo', 'bro', 'hei', 'eh ewe'],
      q    : ['lagi apa?', 'udah makan belum?', 'besok libur gak?', 'ke mana aja lo',
              'kok lama bales sih \uD83D\uDE2D', 'nanti jalan gak?', 'tugas udah dikumpul?',

    while ((n = walker.nextNode()))
      if (n.nodeType === 3 || (n.nodeType === 1 && n.tagName === 'IMG')) nodes.push(n);
    var remaining = off;
    for (var i = 0; i < nodes.length; i++) {
      var nd = nodes[i], L = nodeUnits(nd);
      if (nd.nodeType === 3) {
        if (remaining <= L) {
          var rng = document.createRange();
          rng.setStart(nd, remaining);
          rng.collapse(true);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(rng);
          return;
        }
        remaining -= L;
      } else {
        remaining = remaining < L ? 0 : remaining - L;
      }
    }
    var r2 = document.createRange();
    r2.selectNodeContents(el);
    r2.collapse(false);
    var sel2 = window.getSelection();
    sel2.removeAllRanges();
    sel2.addRange(r2);
  }
  function renderAppleEmojis() {
    var off = getCaretOffset(msgEl);
    var walker = document.createTreeWalker(msgEl, NodeFilter.SHOW_TEXT, null);
    var targets = [], t, changed = false;
    while ((t = walker.nextNode())) targets.push(t);
    targets.forEach(function (tn) { if (processTextNode(tn)) changed = true; });
    if (changed && off !== null) setCaretOffset(msgEl, off);
  }
  msgEl.addEventListener('input', renderAppleEmojis);
  renderAppleEmojis();
</script>
