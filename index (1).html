  /* ================= STATUS BAR ================= */
  .time {
    position: absolute;
    left: 53px;
    top: 25.75px;
    font-size: 25px;
    line-height: 1.26;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: #000;
  }
  .sig  { position: absolute; left: 531px;   top: 29px; width: 33px; height: 22px; }
  .lte  {
    position: absolute;
    left: 568.5px;
    top: 29.2px;
    font-size: 18.5px;
    line-height: 1.26;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #000;
  }
  .batt { position: absolute; left: 605px;   top: 29px; width: 45px; height: 23px; }

  /* ================= STACK: pill + bubble + menu ================= */
  .stack {
    position: absolute;
    left: 18px;
    top: 381px;
    width: 639px;
  }

  /* ---------- Reaction pill ---------- */
  .pill {
    position: relative;
    width: 639px;
    height: 124px;
    background: #fff;
    border-radius: 62px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.16), 0 4px 12px rgba(0,0,0,0.08);
  }
  .cap {
    position: absolute;
    left: 0; right: 0;
    top: 7.7px;
    text-align: center;
    font-size: 22px;
    line-height: 1.26;
    font-weight: 400;
    color: #808080;
  }
  .emoji {
    position: absolute;
    top: 45px;
    width: 85.5px;
    height: 57px;
    line-height: 57px;
    text-align: center;
    font-size: 55px;
    font-family: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif;
  }
  .e1 { left: 19.25px; }  .e2 { left: 104.75px; } .e3 { left: 190.25px; }
  .e4 { left: 275.75px; } .e5 { left: 361.25px; } .e6 { left: 446.75px; }
  .plus { position: absolute; left: 556px; top: 56px; width: 36px; height: 36px; }

  /* ---------- Message bubble (AUTO-SIZE mengikuti teks) ---------- */
  .bubble {
    margin-top: 23px;
    width: fit-content;
    max-width: 462px;
    background: #fff;
    border-radius: 28px;
    padding: 13.5px 20px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.13), 0 3px 10px rgba(0,0,0,0.07);
    font-size: 24px;
    line-height: 29.5px;
    color: #000;
  }
  #msg {
    display: inline-block;
    max-width: 422px;
    outline: none;
    cursor: text;
    overflow-wrap: break-word;
    -webkit-user-select: text;
    user-select: text;
  }

  /* ---------- Context menu ---------- */
  .menu {
    margin-top: 22px;
    width: 245px;
    background: #f6f6f6;
    border-radius: 19px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.20), 0 4px 14px rgba(0,0,0,0.10);
    overflow: hidden;
  }
  .row {
    position: relative;
    height: 71.5px;
  }

<script>
  // Skala artboard agar muat sempurna di layar apa pun (rasio tetap 675:1200)
  var screenEl = document.getElementById('screen');
  function fit() {
    var s = Math.min(window.innerWidth / 675, window.innerHeight / 1200);
    screenEl.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  // Fokus langsung ke teks bubble saat diklik
  var msg = document.getElementById('msg');
  msg.addEventListener('click', function () { msg.focus(); });

  // Tempel sebagai plain text supaya rapi
  msg.addEventListener('paste', function (e) {
    e.preventDefault();
    var t = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, t);
  });
</script>
